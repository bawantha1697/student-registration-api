server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:YOUR-AWS-RDS-ENDPOINT}:5432/postgres?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASS:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always